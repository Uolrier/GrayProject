[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

ignore = []

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "backend",
]
markers = [
    "integration: integration tests"
]